name: verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run generate
      - name: Verify generated client is committed
        run: |
          git status --short -- src/generated
          git diff -- src/generated
          test -z "$(git status --porcelain -- src/generated)"
      - run: npm run typecheck
      - run: npm run build
