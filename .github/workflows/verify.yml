name: verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run generate
      - name: Inspect generated client
        run: |
          find src/generated -type f -print
          for file in $(find src/generated -type f); do
            echo "===== $file ====="
            cat "$file"
          done
      - name: Verify generated client is committed
        run: git diff --exit-code -- src/generated
      - run: npm run typecheck
      - run: npm run build
